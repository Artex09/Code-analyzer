<!doctype html>
<html><head><meta charset="utf-8"></head>
<body>
<div id="out">running</div>
<iframe id="f" src="/" style="width:1400px;height:900px"></iframe>
<script>
const lines = [];
let fails = 0;
function check(label, got, want) {
  const ok = String(got) === String(want);
  if (!ok) fails++;
  lines.push((ok ? "PASS  " : "FAIL  ") + label + "  got=" + got + "  want=" + want);
}
function note(t) { lines.push("      . " + t); }
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
async function until(fn, ms = 9000, what) {
  const t0 = Date.now();
  while (Date.now() - t0 < ms) {
    let v; try { v = fn(); } catch (e) { v = null; }
    if (v) return v;
    await sleep(120);
  }
  lines.push("      ! timed out waiting" + (what ? " for " + what : "") + " after " + ms + "ms");
  return null;
}

function flush(err) {
  const head = err ? "ERROR " + err : (fails ? "FAIL(" + fails + ")" : "ALLPASS");
  document.getElementById("out").textContent = "RESULT " + head + "\n" + lines.join("\n");
}

document.getElementById("f").addEventListener("load", async () => {
  try { await run(); flush(); }
  catch (e) { flush((e && e.message) + " | " + ((e && e.stack) || "").split("\n").slice(0, 3).join(" <- ")); }
});

async function run() {
  const w = document.getElementById("f").contentWindow;
  const d = w.document;
  const disp = (id) => { const e = d.getElementById(id); return e ? w.getComputedStyle(e).display : "MISSING"; };
  const rows = () => d.querySelectorAll('.row[data-path]').length;
  const counter = () => (d.getElementById("result-count") || {}).textContent || "";
  const key = (k, opts) => d.dispatchEvent(new w.KeyboardEvent("keydown", Object.assign({ key: k, bubbles: true }, opts || {})));

  await until(() => d.querySelectorAll(".hist-item").length > 0);

  // ---------------------------------------------------------------- typography
  await w.document.fonts.ready;
  check("Martian Mono loaded", w.document.fonts.check('12px "Martian Mono"'), true);
  check("Bodoni Moda loaded", w.document.fonts.check('28px "Bodoni Moda"'), true);
  check("JetBrains Mono loaded", w.document.fonts.check('12px "JetBrains Mono"'), true);
  check("Archivo loaded", w.document.fonts.check('13px "Archivo"'), true);
  const wm = w.getComputedStyle(d.querySelector(".wordmark")).fontFamily;
  check("wordmark uses display face", /Bodoni/.test(wm), true);
  const lbl = w.getComputedStyle(d.querySelector(".rail-block h3")).fontFamily;
  check("rail labels use Martian Mono", /Martian/.test(lbl), true);

  // ----------------------------------------------------------- startup layout
  check("#help-modal hidden", disp("help-modal"), "none");
  check("#palette hidden", disp("palette"), "none");
  check("#viewer hidden", disp("viewer"), "none");
  check("#split-handle hidden", disp("split-handle"), "none");
  check("7 views in nav", d.querySelectorAll(".view-item").length, 7);

  // ------------------------------------------------------------- load a scan
  const target = [...d.querySelectorAll(".hist-item")]
    .find((el) => el.textContent.includes("juice-shop")) || d.querySelector(".hist-item");
  note("loading " + target.querySelector(".hist-slug").textContent);
  target.click();
  await until(() => d.querySelector(".repo-title") && rows() > 0);
  check("repo header appears", !!d.querySelector(".repo-title"), true);
  check("risk rows rendered", rows() > 50, true);
  note("counter: " + counter());
  const baseRows = rows();

  // ------------------------------------------------------ new data viz bits
  check("score histogram rendered", d.querySelectorAll(".histo-bars i").length, 20);
  check("weakness mix bar rendered", d.querySelectorAll(".mixbar i").length > 3, true);
  check("mix legend rendered", d.querySelectorAll(".mixleg").length > 3, true);
  check("score meters rendered", d.querySelectorAll(".row .meter i").length > 10, true);
  check("triage tally rendered", d.querySelectorAll(".tri-cell").length, 3);
  check("band cells clickable", d.querySelectorAll(".bandcell[data-band]").length, 5);

  // clicking a mix legend filters by weakness class
  const leg = d.querySelector(".mixleg");
  const cat = leg.dataset.cat;
  leg.click();
  await sleep(400);
  const catRows = rows();
  check("class filter narrows list", catRows > 0 && catRows < baseRows, true);
  note("class " + cat + " -> " + catRows + " rows");
  d.querySelector('.mixleg[data-cat="' + cat + '"]').click();
  await sleep(400);
  check("unsetting class filter restores list", rows(), baseRows);

  // clicking a band cell in the rail filters and syncs the chip
  d.querySelector('.bandcell[data-band="high"]').click();
  await sleep(400);
  check("rail band cell filters", rows() < baseRows && rows() > 0, true);
  check("band chip synced from rail", d.querySelector('.chip[data-band="high"]').classList.contains("on"), true);
  d.querySelector('.bandcell[data-band="high"]').click();
  await sleep(400);

  // --------------------------------------------------------------- viewer
  const row = d.querySelector(".row[data-path]");
  const path = row.dataset.path;
  note("opening " + path);
  row.click();
  await until(() => disp("viewer") === "flex" && d.querySelectorAll(".cl").length > 0);
  check("viewer opens", disp("viewer"), "flex");
  check("split handle appears", disp("split-handle"), "block");
  check("syntax highlighting", !!d.querySelector('[class*="pg-"]'), true);
  check("hit lines marked", d.querySelectorAll(".cl.hit").length > 0, true);
  check("minimap marks rendered", d.querySelectorAll("#minimap i").length > 0, true);
  check("minimap viewport indicator", !!d.getElementById("mm-view"), true);

  // n / p step through hits
  key("n");
  await sleep(500);
  const cur1 = d.querySelector(".cl.cur");
  check("n moves to a hit line", !!cur1, true);
  const id1 = cur1 && cur1.id;
  key("n");
  await sleep(500);
  const id2 = (d.querySelector(".cl.cur") || {}).id;
  check("n advances to the next hit", id2 !== id1, true);
  key("p");
  await sleep(500);
  check("p goes back", (d.querySelector(".cl.cur") || {}).id, id1);

  // ---------------------------------------------------------------- triage
  d.getElementById("btn-triage").click();
  await until(() => d.querySelector("#vt-meta .trimark"));
  check("mark button sets triage", !!d.querySelector("#vt-meta .trimark"), true);
  check("triage tally counts it", [...d.querySelectorAll(".tri-cell .tc-n")].some((e) => e.textContent !== "0"), true);
  note("state after 1 press: " + d.querySelector("#vt-meta .trimark").textContent.trim());
  key("t");                        // looking -> confirmed
  await until(() => /confirmed/.test(d.querySelector("#vt-meta .trimark").textContent));
  check("t cycles to confirmed", /confirmed/.test(d.querySelector("#vt-meta .trimark").textContent), true);
  check("triage badge on view nav", !!d.querySelector(".view-item .vbadge"), true);

  // the triage board should now list it
  d.querySelector('.view-item[data-view="triage"]').click();
  await until(() => d.querySelectorAll(".row[data-path]").length > 0);
  check("triage board lists the marked file",
    [...d.querySelectorAll(".row[data-path]")].some((el) => el.dataset.path === path), true);
  check("triage board group label", !!d.querySelector(".gh-label"), true);

  // clean up: unmark so repeat runs start clean
  key("t");  await sleep(600);     // confirmed -> dismissed
  key("t");  await sleep(600);     // dismissed -> unmarked
  check("triage clears back to unmarked", !d.querySelector("#vt-meta .trimark"), true);

  // -------------------------------------------------------------- palette
  key("k", { ctrlKey: true });
  await until(() => disp("palette") === "flex");
  check("ctrl+k opens the palette", disp("palette"), "flex");
  await until(() => d.querySelectorAll(".pal-item").length > 0);
  check("palette lists files", d.querySelectorAll(".pal-item").length > 0, true);
  const inp = d.getElementById("pal-input");
  inp.value = "login";
  inp.dispatchEvent(new w.Event("input", { bubbles: true }));
  await sleep(350);
  const first = d.querySelector(".pal-item .pal-path");
  check("fuzzy search matches", /login/i.test(first.textContent), true);
  check("match characters highlighted", !!d.querySelector(".pal-item .pal-path b"), true);
  note("top palette hit: " + first.textContent.trim());
  inp.dispatchEvent(new w.KeyboardEvent("keydown", { key: "Enter", bubbles: true }));
  await until(() => disp("palette") === "none");
  check("enter opens the file and closes palette", disp("palette"), "none");
  await until(() => /login/i.test(d.getElementById("vt-path").textContent), 9000, "the chosen file to open");
  check("viewer now shows the chosen file", /login/i.test(d.getElementById("vt-path").textContent), true);

  // command mode
  key("k", { ctrlKey: true });
  await until(() => disp("palette") === "flex");
  const inp2 = d.getElementById("pal-input");
  inp2.value = ">hotspot";
  inp2.dispatchEvent(new w.Event("input", { bubbles: true }));
  await sleep(350);
  check("command mode switches sigil", d.getElementById("pal-sigil").textContent, "cmd");
  await until(() => d.querySelector(".pal-item"), 4000, "a command match for >hotspot");
  const cmdHit = d.querySelector(".pal-item");
  check("command matched by view id", cmdHit && /Directory Heat/i.test(cmdHit.textContent), true);
  inp2.dispatchEvent(new w.KeyboardEvent("keydown", { key: "Enter", bubbles: true }));
  await until(() => d.querySelectorAll(".hs-row").length > 0);
  check("command switched the view", d.querySelectorAll(".hs-row").length > 0, true);

  // ------------------------------------------------------------ dataflow layer
  const boot = await w.fetch("/api/bootstrap").then((r) => r.json());
  check("dataflow capability advertised", !!boot.analysis, true);
  check("python has a parser", boot.analysis.python && boot.analysis.python.parser, true);
  check("typescript modelled in full", boot.analysis.typescript.depth, "full");
  check("deep toggle present and on", d.getElementById("deep-input").checked, true);

  const sid = w.location.hash.replace(/^#/, "").split("/")[0];
  const tf = await w.fetch("/api/scan/" + sid
    + "/file?path=" + encodeURIComponent("routes/userProfile.ts")).then((r) => r.json());
  const taint = (tf.hits || []).filter((h) => h.engine === "taint");
  check("dataflow findings present on a known vulnerable file", taint.length > 0, true);
  if (taint.length) {
    check("finding carries a trace", (taint[0].trace || []).length > 1, true);
    check("finding names its source", !!taint[0].source, true);
    check("finding has a confidence", ["high", "medium", "low"].includes(taint[0].confidence), true);
    note("traced: " + taint[0].source + " -> L" + taint[0].line
         + " (" + taint[0].trace.length + " hops)");
  }
  check("file reports which engine ran", (tf.record.analysis || {}).engine, "ast+taint");

  // The viewer should render the trace. Wait for the title to be the file we asked for:
  // waiting only for ".vs-taint" passes instantly against whatever file was already open,
  // which silently moved these checks onto the wrong file.
  const openAt = async (p) => {
    w.location.hash = sid + "/" + p;
    await until(() => d.getElementById("vt-path").textContent === p, 9000, "viewer on " + p);
  };
  await openAt("routes/userProfile.ts");
  await until(() => d.querySelector(".vs-taint"), 9000, "a dataflow finding in the viewer");
  check("viewer marks dataflow findings", !!d.querySelector(".vs-taint"), true);
  check("viewer renders trace steps", d.querySelectorAll(".tstep").length > 1, true);
  check("viewer shows a confidence badge", !!d.querySelector(".ebadge"), true);

  // -------------------------------------------- path conditions and the solver
  const solver = boot.analysis._solver || {};
  check("solver capability advertised", typeof solver.available, "boolean");
  if (solver.available) {
    check("solver reports a version", /^\d/.test(String(solver.version)), true);
    check("solver models the command class", (solver.classes || []).includes("cmd"), true);
    note("z3 " + solver.version + ", payload models: " + (solver.classes || []).length);
  } else {
    note("z3 is not installed; path conditions are off and findings keep their guards");
  }
  const xcap = boot.analysis._cross_file || {};
  check("cross-file capability advertised", !!xcap.available, true);
  check("cross-file toggle present and on", d.getElementById("cross-input").checked, true);
  check("capability line mentions the solver",
        /solver:/.test(d.getElementById("rule-count").textContent), true);
  check("capability line mentions cross-file",
        /cross-file:/.test(d.getElementById("rule-count").textContent), true);

  const sum = (await w.fetch("/api/scan/" + sid).then((r) => r.json())).summary || {};
  check("summary counts solver queries", typeof sum.solver_queries, "number");
  check("summary counts cross-file findings", typeof sum.cross_findings, "number");
  check("summary records the cross-file pass", !!sum.cross, true);
  note("scan summary: " + sum.taint_findings + " dataflow, " + sum.cross_findings
       + " cross-file, " + sum.witness_findings + " with a witness, "
       + sum.solver_queries + " solver queries in " + sum.solver_ms + "ms");

  // a file whose guards the solver read should expose them on the finding
  const guarded = (tf.hits || []).filter((h) => (h.guards || []).length);
  note("guards rendered on " + guarded.length + " finding(s) of this file");
  if (guarded.length) {
    await openAt("routes/userProfile.ts");
    await until(() => d.querySelector(".vs-hit"), 9000, "findings in the viewer");
    check("viewer renders path conditions", !!d.querySelector(".gcond"), true);
    check("every collected condition is shown",
          d.querySelectorAll(".gcond").length >= guarded[0].guards.length, true);
  }

  // ------------------------------------------------- verdicts, evidence, signals
  check("summary separates findings from leads", typeof sum.confirmed_findings, "number");
  check("summary counts pattern matches apart", typeof sum.pattern_hits, "number");
  check("summary counts annotations apart", typeof sum.signal_hits, "number");
  note("verdicts: " + sum.confirmed_findings + " findings, " + sum.lead_findings
       + " leads, " + sum.pattern_hits + " pattern matches, " + sum.signal_hits
       + " annotations, " + sum.regex_demoted + " demoted by the dataflow pass");

  const flowHits = (tf.hits || []).filter((h) => h.engine === "taint");
  if (flowHits.length) {
    const ev = flowHits[0].evidence || {};
    check("a flow finding carries itemised evidence", !!ev.source && !!ev.value, true);
    check("evidence names a verdict", ["finding", "lead"].includes(ev.verdict), true);
    note("evidence: source=" + ev.source + " value=" + ev.value + " flow=" + ev.flow
         + " guard=" + ev.guard + " -> " + ev.verdict);
  }
  // an annotation must never carry a CWE or a weight
  const annotations = (tf.hits || []).filter((h) => h.tier === "signal");
  for (const a of annotations.slice(0, 3)) {
    check("annotation " + a.rule + " carries no CWE", a.cwe || "", "");
  }
  if (annotations.length) note(annotations.length + " annotation(s) on this file");

  await openAt("routes/userProfile.ts");
  await until(() => d.querySelector(".vs-hit"), 9000, "findings in the viewer");
  check("viewer renders the evidence grid", !!d.querySelector(".evid .ecell"), true);
  check("viewer labels a verdict", !!d.querySelector(".vbadge"), true);
  const buckets = [...d.querySelectorAll(".vs-block h4")].map((h) => h.textContent.trim());
  check("viewer separates the buckets", buckets.length > 1, true);
  note("buckets: " + buckets.map((b) => b.split("(")[0].trim()).join(" | "));

  // ----------------------------------------- the context pass and what it ruled out
  // A scan saved before the context pass existed has none of these fields, and failing
  // on old data on disk would be a false alarm about the code. Say so and move on.
  const hasCtx = typeof sum.dismissed === "number";
  if (!hasCtx) {
    note("this scan predates the context pass; rescan to exercise it "
         + "(no `dismissed` in its summary)");
  } else {
    check("summary counts ruled-out matches", typeof sum.dismissed, "number");
    check("summary records the deployment type",
          typeof ((sum.deployment || {}).kind), "string");
    note("deployment: " + ((sum.deployment || {}).describe || "(none)")
         + " | ruled out: " + sum.dismissed
         + (sum.dismissed_by ? " (" + Object.entries(sum.dismissed_by)
            .map(([k, n]) => n + " " + k).join(", ") + ")" : ""));
  }

  // Find a file the context pass acted on and prove the reason reaches both the viewer
  // and the verify prompt. A dismissal the user cannot read is a silent drop.
  const allFiles = hasCtx ? ((await w.fetch("/api/scan/" + sid + "/index")
    .then((r) => r.json())).files || []) : [];
  const ruledRow = allFiles.filter((f) => f.d > 0).sort((a, b) => b.d - a.d)[0];
  let ruledFile = null;
  if (ruledRow) {
    ruledFile = await w.fetch("/api/scan/" + sid + "/file?path="
      + encodeURIComponent(ruledRow.p)).then((r) => r.json());
  }
  // the file endpoint wraps the scan record one level down
  const ruledRec = (ruledFile || {}).record || {};
  if (!(ruledRec.dismissed || []).length) {
    note("no ruled-out matches in this scan; the context pass had nothing to do here");
  } else {
    const item = ruledRec.dismissed[0];
    check("a ruled-out match keeps its line", typeof item.line, "number");
    check("a ruled-out match names a reason kind", !!item.kind, true);
    check("a ruled-out match explains itself in words", item.why.length > 40, true);
    note("ruled out in " + ruledRow.p + ": " + item.rule + " L" + item.line
         + " [" + item.kind + "]");
    await openAt(ruledRow.p);
    await until(() => d.querySelector(".vs-dismissed"), 9000, "the ruled-out block");
    check("viewer shows the ruled-out block", !!d.querySelector(".vs-dismissed"), true);
    check("viewer prints the reason", (d.querySelector(".ruled-why") || {}).textContent
          ? d.querySelector(".ruled-why").textContent.length > 40 : false, true);
    check("viewer strikes through the rule that was ruled out",
          !!d.querySelector(".ruled-rule"), true);
    const vp = await w.fetch("/api/scan/" + sid + "/verify?path="
                             + encodeURIComponent(ruledRow.p))
      .then((r) => r.json());
    check("verify prompt lists what was ruled out",
          (vp.prompt || "").includes("ruled out"), true);
    check("verify prompt invites disagreement",
          (vp.prompt || "").includes("so you can disagree"), true);
  }

  // ------------------------------------- the identity layer, end to end in the UI
  // `exec` is not always child_process.exec. When a scan carries that verdict, the
  // definition the resolver read has to reach the page: a dismissal whose reason is
  // "trust me" is the thing this layer was built to stop being.
  if (hasCtx) {
    const kinds = sum.dismissed_by || {};
    if (!kinds["wrong-function"]) {
      note("no name-resolution verdicts in this scan; nothing to render");
    } else {
      note("name resolved to a different function " + kinds["wrong-function"] + "x");
      let found = null;
      for (const row of allFiles.filter((f) => f.d > 0).sort((a, b) => b.d - a.d)
        .slice(0, 12)) {
        const rec = ((await w.fetch("/api/scan/" + sid + "/file?path="
          + encodeURIComponent(row.p)).then((r) => r.json())) || {}).record || {};
        const hitItem = (rec.dismissed || []).find((x) => x.kind === "wrong-function");
        if (hitItem) { found = { path: row.p, item: hitItem }; break; }
      }
      check("a wrong-function verdict is on a file", !!found, true);
      if (found) {
        check("  ... and quotes the definition it read",
              /\bis\b/.test(found.item.why) && found.item.why.length > 40, true);
        note("wrong function in " + found.path + ": " + found.item.why.slice(0, 120));
      }
    }
    check("the report counts matches that were text, not code",
          typeof sum.text_not_code, "number");
  }

  // ------------------------------------------------------- cross-file findings
  // Only some repositories have a flow that leaves a file, so this runs against whichever
  // scan in history has one and reports plainly when none does.
  const hist = (await w.fetch("/api/history").then((r) => r.json())).history || [];
  let xscan = null;
  for (const row of hist.slice(0, 12)) {
    const head = await w.fetch("/api/scan/" + row.id).then((r) => r.json());
    if ((head.summary || {}).cross_findings > 0) { xscan = head; break; }
  }
  if (!xscan) {
    note("no scan in history has a cross-file finding; rendering not exercised");
  } else {
    const idx = await w.fetch("/api/scan/" + xscan.id + "/index").then((r) => r.json());
    const target = (idx.files || []).find((f) => f.x > 0);
    check("a file carries the cross-file count", !!target, true);
    const tpath = target ? target.p : null;
    if (!tpath) {
      note("index has no cross-file column; skipping the rendering checks");
    } else {
      w.location.hash = xscan.id + "/" + tpath;
      await until(() => d.getElementById("vt-path").textContent === tpath, 12000,
                  "viewer on " + tpath);
      await until(() => d.querySelector(".vs-cross"), 9000, "a cross-file finding");
      check("viewer marks cross-file findings", !!d.querySelector(".vs-cross"), true);
      check("cross-file badge rendered", !!d.querySelector(".ebadge.xfile"), true);
      check("trace names the other file", !!d.querySelector(".thop"), true);
      // one of the entry points can be this very file; pick one that is not
      const before = d.getElementById("vt-path").textContent;
      const entry = [...d.querySelectorAll(".xentry")].find(
        (el) => (el.dataset.open || "").split("#")[0] !== before);
      if (entry) {
        entry.click();
        const moved = await until(
          () => d.getElementById("vt-path").textContent !== before, 9000, "the entry file");
        check("clicking an entry opens the calling file", !!moved, true);
        note("followed the flow to " + d.getElementById("vt-path").textContent);
      }
      note("cross-file example: " + xscan.repo.slug + " " + tpath
           + " (" + target.x + " cross-file finding(s))");
    }
  }

  // ------------------------------------------------------- verification prompt
  d.querySelector('.view-item[data-view="risk"]').click();
  await until(() => rows() > 0);
  d.querySelector(".row[data-path]").click();
  await until(() => disp("viewer") === "flex");
  const vpath = d.getElementById("vt-path").textContent;
  check("verify button present", !!d.getElementById("btn-verify"), true);
  const vr = await w.fetch("/api/scan/" + w.location.hash.replace(/^#/, "").split("/")[0]
    + "/verify?path=" + encodeURIComponent(vpath)).then((r) => r.json());
  check("verify endpoint returns a prompt", vr.prompt && vr.prompt.length > 500, true);
  for (const section of ["## Target", "## What the scanner flagged", "## Source",
                         "TRUE POSITIVE", "NEED MORE CONTEXT"]) {
    check("prompt contains " + JSON.stringify(section), vr.prompt.includes(section), true);
  }
  check("prompt pins the commit", /blob\/[0-9a-f]{7,}\//.test(vr.prompt), true);
  check("prompt reports a token estimate", vr.approx_tokens > 100, true);
  note("prompt for " + vpath + ": ~" + vr.approx_tokens + " tokens");

  // ---------------------------------------------------------- density + split
  const rowPadBefore = w.getComputedStyle(d.documentElement).getPropertyValue("--row-pad").trim();
  d.getElementById("btn-density").click();
  await sleep(250);
  const rowPadAfter = w.getComputedStyle(d.documentElement).getPropertyValue("--row-pad").trim();
  check("density toggle changes row padding", rowPadAfter !== rowPadBefore, true);
  note("row padding " + rowPadBefore + " -> " + rowPadAfter);
  d.getElementById("btn-density").click();
  await sleep(250);

  d.querySelector('.view-item[data-view="risk"]').click();
  await until(() => rows() > 0);
  d.querySelector(".row[data-path]").click();
  await until(() => disp("viewer") === "flex");
  const handle = d.getElementById("split-handle");
  const wBefore = w.getComputedStyle(d.documentElement).getPropertyValue("--viewer-w").trim();
  handle.dispatchEvent(new w.MouseEvent("mousedown", { bubbles: true, clientX: 800 }));
  w.dispatchEvent(new w.MouseEvent("mousemove", { bubbles: true, clientX: 600 }));
  w.dispatchEvent(new w.MouseEvent("mouseup", { bubbles: true, clientX: 600 }));
  await sleep(250);
  const wAfter = w.getComputedStyle(d.documentElement).getPropertyValue("--viewer-w").trim();
  check("dragging the handle resizes the viewer", wAfter !== wBefore, true);
  note("viewer width " + wBefore + " -> " + wAfter);

  // ------------------------------------------------------------- persistence
  check("prefs written to localStorage", !!w.localStorage.getItem("repoxray.prefs.v1"), true);
  const prefs = JSON.parse(w.localStorage.getItem("repoxray.prefs.v1") || "{}");
  check("viewer width persisted", !!prefs.viewerWidth, true);
  check("view persisted", !!prefs.view, true);

  // ------------------------------------------------------------ help + escape
  d.getElementById("btn-help").click();
  check("help opens", disp("help-modal"), "flex");
  d.getElementById("help-close").click();
  check("got it closes help", disp("help-modal"), "none");
  key("Escape");
  await sleep(250);
  check("escape closes the viewer", disp("viewer"), "none");
